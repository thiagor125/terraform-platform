name: Reusable Terraform Apply

on:
  workflow_call:
    inputs:
      working_directory: { required: true, type: string }
      aws_region: { required: true, type: string }
      role_arn: { required: true, type: string }
      state_bucket: { required: true, type: string }
      state_key: { required: true, type: string }
      environment: { required: true, type: string }
      terraform_version:
        required: false
        type: string
        default: "1.16.1"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          role-session-name: terraform-apply-${{ github.run_id }}
          aws-region: ${{ inputs.aws_region }}
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: Terraform Init
        working-directory: ${{ inputs.working_directory }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ inputs.state_bucket }}" \
            -backend-config="key=${{ inputs.state_key }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Terraform Validate
        working-directory: ${{ inputs.working_directory }}
        run: terraform validate
      - name: Terraform Plan
        working-directory: ${{ inputs.working_directory }}
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      - name: Terraform Apply
        working-directory: ${{ inputs.working_directory }}
        run: terraform apply -input=false -auto-approve tfplan
