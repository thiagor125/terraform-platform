name: AWS Lab - HCP Remote Apply

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-lab-hcp-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: aws-lab
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Terraform Init
        run: terraform -chdir=environments/aws/lab init -reconfigure

      - name: Terraform Validate
        run: terraform -chdir=environments/aws/lab validate

      - name: HCP Remote Plan
        run: terraform -chdir=environments/aws/lab plan -input=false -no-color

      - name: HCP Remote Apply
        run: terraform -chdir=environments/aws/lab apply -input=false -auto-approve
