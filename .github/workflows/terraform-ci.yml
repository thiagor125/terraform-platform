name: Terraform CI

on:
  push:
    branches:
      - main
    paths:
      - "environments/aws/lab/**"
      - "modules/aws/network/**"
      - ".github/workflows/terraform-ci.yml"
  pull_request:
    paths:
      - "environments/aws/lab/**"
      - "modules/aws/network/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init Without Backend
        run: terraform -chdir=environments/aws/lab init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=environments/aws/lab validate

      - name: Terraform Test
        run: terraform -chdir=modules/aws/network test
